plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}

group = 'com.proxy-seller'
version = '2.0'

java {
    withJavadocJar()
    withSourcesJar()
}

// Без явного release байткод собирается под тот JDK, которым собирали (у нас 21), и
// jar-ы из dist/ молча перестают запускаться на JDK клиента. release (а не source/target)
// проверяет заодно и API: случайный вызов метода из более нового JDK не соберётся здесь,
// вместо NoSuchMethodError у клиента.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}
jar {
    exclude('/org/proxyseller/Debug.class')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = rootProject.name
            from components.java

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

            pom {
                name = 'Proxy-seller User Api client'
                description = 'Interaction with user api'
                url = 'https://proxy-seller.com/personal/api/'
                organization {
                    name = 'Proxy-Seller'
                    url = 'https://proxy-seller.com/'
                }
                licenses {
                    license {
                        name.set("The Apache License, Version 2.0")
                        url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/proxy-seller/user-api-java.git'
                    developerConnection = 'scm:git:https://github.com/proxy-seller/user-api-java.git'
                    url = 'https://github.com/proxy-seller/user-api-java'
                }
                developers {
                    developer {
                        id.set("proxy-seller")
                        name.set("proxy-seller")
                        email.set("support@proxy-seller.com")
                    }
                }
            }
        }
    }
    repositories {
        maven {
            def releasesRepoUrl = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl

            credentials {
                username = findProperty("sonatypeUsername").toString()
                password = findProperty("sonatypePassword").toString()
            }
        }
    }
}

signing {
    def signingKeyId = findProperty("signingKeyId").toString()
    def signingKey = findProperty("signingKey").toString()
    def signingPassword = findProperty("signingPassword").toString()

    useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

tasks.register('standaloneJar', Jar) {
    archiveFileName = "${rootProject.name}-${version}-standalone.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

tasks.register('build_standalone') {
    dependsOn standaloneJar
    dependsOn sourcesJar
    dependsOn javadocJar
    doLast {
        delete 'dist'
        copy {
            from standaloneJar
            into 'dist'
        }
        copy {
            from sourcesJar
            into 'dist'
        }
        copy {
            from javadocJar
            into 'dist'
        }
        println('ok')
    }
}

javadoc {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}