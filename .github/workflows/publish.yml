name: Publish to Maven Central

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode gradle.properties
        run: |
          mkdir -p ~/.gradle
          echo "${{ secrets.GRADLE_PROPS }}" | base64 -d > ~/.gradle/gradle.properties

      - name: Publish
        # gradlew лежит в git без флага исполнения, поэтому через bash.
        run: bash ./gradlew publish

      - name: Hand over to Central Portal
        # Загрузка через OSSRH Staging API сама в портале не появится: её передаёт этот вызов,
        # и только с того же IP, с которого шла загрузка, — поэтому он в этом же джобе.
        # user_managed: сборка ждёт в портале (Deployments), Publish нажимается вручную.
        run: |
          U=$(grep '^sonatypeUsername=' ~/.gradle/gradle.properties | cut -d= -f2- | tr -d '\r')
          P=$(grep '^sonatypePassword=' ~/.gradle/gradle.properties | cut -d= -f2- | tr -d '\r')
          echo "::add-mask::$U"
          echo "::add-mask::$P"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $(printf '%s:%s' "$U" "$P" | base64 -w0)" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.proxy-seller?publishing_type=user_managed"
